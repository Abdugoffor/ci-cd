networks:
  traefik-network:
    external: true
volumes:
  fide_project:
    
services:
  fide_nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: "nginx:stable-alpine"
    networks:
      - traefik-network
    ports:
      - "8010:80"
    volumes:
      - fide_project:/var/www/laravel
      - /srv/fide_uploads:/var/www/laravel/public/uploaded
    depends_on:
      - fide_postgres
      - fide_php
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.fide_nginx.rule=Host(`regsys098801.fide.com`)'
      - 'traefik.http.routers.fide_nginx.service=fide_nginx'
      - 'traefik.http.routers.fide_nginx.entrypoints=websecure'
      - 'traefik.http.services.fide_nginx.loadbalancer.server.port=80'
      - 'traefik.http.routers.fide_nginx.tls=true'
      - 'traefik.http.routers.fide_nginx.tls.certresolver=letsencrypt'
      - 'traefik.http.services.fide_nginx.loadbalancer.passhostheader=true'
      - 'traefik.http.routers.fide_nginx.middlewares=compresstraefik'
      - 'traefik.http.middlewares.compresstraefik.compress=true'
      - 'traefik.docker.network=traefik-network'
  fide_php:
    build:
      context: .
      dockerfile: dockerfiles/php.Dockerfile
    networks:
      - traefik-network
    depends_on:
      - fide_postgres   
    volumes:
      - fide_project:/var/www/laravel
      - /srv/fide_uploads:/var/www/laravel/public/uploaded

  fide_postgres:
    image: postgres:15
    restart: always
    env_file:
      - env/postgres.env
    volumes:
      - /srv/fide_db:/var/lib/postgresql/data
    networks:
      - traefik-network
