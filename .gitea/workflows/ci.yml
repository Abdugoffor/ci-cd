name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build --force-recreate -d 
      
      - name: Verify Laravel Directory fide_php
        run: |
          docker exec shaxmat_fide-fide_php-1 ls -lah /var/www/
          docker exec shaxmat_fide-fide_php-1 ls -lah /var/www/laravel      

      - name: Verify Laravel Directory fide_nginx
        run: |
          docker exec shaxmat_fide-fide_nginx-1 ls -lah /var/www/
          docker exec shaxmat_fide-fide_nginx-1 ls -lah /var/www/laravel 
           
      - name: Check nginx.conf inside Nginx container
        run: |
          docker exec shaxmat_fide-fide_nginx-1 cat /etc/nginx/conf.d/default.conf | grep "client_max_body_size 500M;" || {
            echo "Xatolik: client_max_body_size 500M Nginx konfiguratsiyasida topilmadi!"
            exit 1
          }
          echo "client_max_body_size 500M Nginx konfiguratsiyasida mavjud!"            

