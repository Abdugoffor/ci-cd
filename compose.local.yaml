version: '3.8'

services:
  fide_nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: nginx:stable-alpine
    ports:
      - "8010:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel
    depends_on:
      - fide_postgres
      - fide_php
    networks:
      - app-network

  fide_php:
    build:
      context: .
      dockerfile: dockerfiles/php.Dockerfile
    volumes:
      - ./src:/var/www/laravel
      - ./src/public/uploaded:/var/www/laravel/public/uploaded
    environment:
      - PHP_EXTENSION=pdo_pgsql,pgsql
    depends_on:
      - fide_postgres
    networks:
      - app-network

  fide_postgres:
    image: postgres:15
    restart: always
    env_file:
      - env/postgres.env
    volumes:
      - ./fide_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  fide_db: